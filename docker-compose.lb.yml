services:
  api1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    restart: unless-stopped
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
  api2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    restart: unless-stopped
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
  api3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    restart: unless-stopped
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
      api3: {condition: service_healthy}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./deployment/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
