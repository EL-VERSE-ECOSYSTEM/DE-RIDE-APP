map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream deride_api {
    # Keep a client on the same process for process-local WebSocket rooms.
    # Durable writes and checkout idempotency are enforced by Postgres.
    ip_hash;
    server api1:8080 max_fails=2 fail_timeout=10s;
    server api2:8080 max_fails=2 fail_timeout=10s;
    server api3:8080 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;

    location / {
        proxy_pass http://deride_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
